packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true

# Settings previously in .npmrc; pnpm 11 only reads them from this file.
autoInstallPeers: true
saveWorkspaceProtocol: true

# Make pnpm 11's default supply-chain age gate explicit. Freshly published
# versions are rejected for 24h unless listed in minimumReleaseAgeExclude.
minimumReleaseAge: 1440

catalog:
  '@eslint/core': ^1.2.1
  '@eslint/json': ^2.0.1
  '@faker-js/faker': ^10.5.0
  '@keyv/compress-gzip': ^2.0.3
  '@types/node': ^22.20.0
  '@vitest/coverage-istanbul': ^4.1.10
  '@vitest/coverage-v8': ^4.1.10
  '@vitest/eslint-plugin': ^1.6.21
  acorn-jsx: ^5.3.2
  axios: ^1.18.1
  axios-cache-interceptor: ^1.12.0
  axios-retry: ^4.5.0
  cacheable: ^2.5.0
  eslint: ^10.6.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-eslint-plugin: ^7.4.1
  eslint-plugin-n: ^18.2.1
  eslint-plugin-only-warn: ^1.2.1
  eslint-plugin-prettier: ^5.5.6
  eslint-plugin-turbo: ^2.10.3
  eslint-scope: ^9.1.2
  keyv: ^5.6.0
  keyv-file: ^5.3.5
  lockfile: ^1.0.4
  lint-staged: ^17.0.8
  memfs: ^4.57.8
  mocked-env: ^1.3.5
  nock: ^14.0.16
  prettier: ^3.9.4
  swagger-typescript-api: ^13.12.4
  tsc-watch: ^7.2.1
  tsup: ^8.5.1
  typescript: ^6.0.3
  typescript-eslint: ^8.62.1
  vite: ^8.1.3
  vitest: ^4.1.10
  yaml: ^2.9.0
  zod: ^4.4.3

minimumReleaseAgeExclude:
  - '@vitest/coverage-istanbul@4.1.10'
  - '@vitest/coverage-v8@4.1.10'
  - '@vitest/expect@4.1.10'
  - '@vitest/mocker@4.1.10'
  - '@vitest/pretty-format@4.1.10'
  - '@vitest/runner@4.1.10'
  - '@vitest/snapshot@4.1.10'
  - '@vitest/spy@4.1.10'
  - '@vitest/utils@4.1.10'
  - vitest@4.1.10
