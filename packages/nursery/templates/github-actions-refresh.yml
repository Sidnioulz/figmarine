# Scheduled Figma cutting refresh, powered by @figmarine/nursery.
#
# Setup:
# 1. Copy this file to .github/workflows/refresh-cuttings.yml in the
#    repository that hosts your .figmarine/ directory.
# 2. Add a FIGMA_PERSONAL_ACCESS_TOKEN repository secret (a token with read
#    access to the configured files).
# 3. Enable "Allow GitHub Actions to create and approve pull requests" in
#    Settings → Actions → General → Workflow permissions (off by default in
#    organizations); without it the PR creation step fails.
# 4. Pin the @figmarine/nursery version below and let Dependabot or Renovate
#    propose bumps: an unpinned npx run would execute whatever was last
#    published, with your Figma token in its environment.
#
# Note: pull requests created with the default GITHUB_TOKEN do not trigger
# `on: pull_request` workflows, so the refresh PR will show no CI checks.
# Use a fine-grained PAT or GitHub App token in the create-pull-request
# step's `token` input if your branch protection requires checks.
name: Refresh Figma cuttings

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh cuttings
        # Pin to the version you have vetted, e.g. @figmarine/nursery@1.2.3.
        run: npx --yes @figmarine/nursery@latest refresh
        env:
          FIGMA_PERSONAL_ACCESS_TOKEN: ${{ secrets.FIGMA_PERSONAL_ACCESS_TOKEN }}

      - name: Open a pull request with the refreshed cuttings
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: .figmarine
          branch: figmarine/refresh-cuttings
          commit-message: 'chore(figma): Refresh cuttings'
          title: 'chore(figma): Refresh cuttings'
          body: |
            Automated refresh of the Figma cuttings in `.figmarine/cuttings/`.

            Review the diff to see what changed in the underlying Figma files.
