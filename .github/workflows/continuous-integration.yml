# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Used by the Dependabot automerge workflow to run CI on commits pushed
  # with GITHUB_TOKEN, which never trigger pull_request events themselves.
  workflow_dispatch:

# Every job only reads the repository; coverage upload authenticates with
# CODECOV_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository
        uses: ./.github/actions/setup-repo
      - name: Check for linter errors
        run: pnpm lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository
        uses: ./.github/actions/setup-repo
      - name: Run tests
        run: pnpm test:coverage
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository
        uses: ./.github/actions/setup-repo
      - name: Run build
        run: pnpm build

  # The generated REST client must stay in sync with the pinned
  # @figma/rest-api-spec version. Regeneration is deterministic (the spec is
  # read from node_modules), so any diff means someone bumped the spec or the
  # generator without running `pnpm api:regen`.
  api-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup repository
        uses: ./.github/actions/setup-repo
      - name: Regenerate API clients
        run: pnpm api:regen
      - name: Check for drift in generated code
        # `git add -A` first so new, renamed or deleted generated files are
        # caught too, not just edits to tracked files.
        run: |
          git add -A packages/rest/src/__generated__
          if ! git diff --cached --exit-code -- packages/rest/src/__generated__; then
            echo "::error::Generated API client is out of date. Run 'pnpm api:regen' and commit the result."
            exit 1
          fi
