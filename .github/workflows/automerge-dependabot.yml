# Inspired by https://github.com/vercel/turborepo/blob/main/.github/workflows/examples-autoapprove-and-automerge.yml
# Auto-approves and auto-merges Dependabot PRs.
# If PRs involve an OpenAPI Spec package, also auto-regens generated API code before merging.
name: Dependabot automerge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-regen-api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    if: github.actor == 'dependabot[bot]' && contains(github.event.pull_request.title, 'Bump the oas group')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Regenerate API clients on OpenAPI Spec change
        run: pnpm api:regen

      # Only commit when regeneration changed the output: a spec package bump
      # without codegen changes must not fail the job (and needs no release).
      - name: Commit regenerated API clients
        id: commit
        run: |
          git config user.name github-actions-shell
          git config user.email github-actions[bot]@users.noreply.github.com
          git add packages/rest/src/__generated__
          if git diff --cached --quiet; then
            echo "No generated code changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -nm "feat(rest): Update OpenAPI Spec generated code"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN do not trigger `pull_request` workflows,
      # so the CI checks required for auto-merge would never run on the new
      # commit. workflow_dispatch is exempt from that rule, so trigger CI
      # explicitly on the updated branch.
      - name: Trigger CI on the regenerated commit
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run CI --ref "$HEAD_REF" --repo "$GITHUB_REPOSITORY"
        env:
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependabot-approve:
    needs: [dependabot-regen-api]
    runs-on: ubuntu-latest
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
      - name: Approve a PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
  dependabot-merge:
    needs: [dependabot-approve]
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
